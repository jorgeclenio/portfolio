<footer class="border-t border-border/80 bg-bg/80 backdrop-blur">
  <div
    class="mx-auto flex max-w-5xl flex-col items-stretch gap-[calc(1rem*0.85)] px-4 py-[calc(1rem*0.85)] md:flex-row md:items-center md:justify-between"
  >
    <div class="flex justify-center md:justify-start">
      <div
        class="inline-flex items-center gap-0.5 rounded-lg border border-border bg-bg p-[calc(0.125rem*0.85)] shadow-sm"
        role="group"
        [attr.aria-label]="language.messages().footerLangLabel"
      >
        <button
          type="button"
          class="min-w-[calc(2.75rem*0.85)] rounded-md px-[calc(0.5rem*0.85)] py-[calc(0.5rem*0.85)] text-xs font-semibold tracking-wide text-muted transition-colors hover:bg-border/50 hover:text-fg focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
          [class.bg-border/60]="language.locale() === 'pt-BR'"
          [class.text-fg]="language.locale() === 'pt-BR'"
          [attr.aria-pressed]="language.locale() === 'pt-BR'"
          [attr.aria-label]="language.messages().footerLangPortuguese"
          (click)="setLocale('pt-BR')"
        >
          PT
        </button>
        <button
          type="button"
          class="min-w-[calc(2.75rem*0.85)] rounded-md px-[calc(0.5rem*0.85)] py-[calc(0.5rem*0.85)] text-xs font-semibold tracking-wide text-muted transition-colors hover:bg-border/50 hover:text-fg focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
          [class.bg-border/60]="language.locale() === 'en'"
          [class.text-fg]="language.locale() === 'en'"
          [attr.aria-pressed]="language.locale() === 'en'"
          [attr.aria-label]="language.messages().footerLangEnglish"
          (click)="setLocale('en')"
        >
          EN
        </button>
        <button
          type="button"
          class="min-w-[calc(2.75rem*0.85)] rounded-md px-[calc(0.5rem*0.85)] py-[calc(0.5rem*0.85)] text-xs font-semibold tracking-wide text-muted transition-colors hover:bg-border/50 hover:text-fg focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
          [class.bg-border/60]="language.locale() === 'es'"
          [class.text-fg]="language.locale() === 'es'"
          [attr.aria-pressed]="language.locale() === 'es'"
          [attr.aria-label]="language.messages().footerLangSpanish"
          (click)="setLocale('es')"
        >
          ES
        </button>
      </div>
    </div>

    <div class="flex flex-1 justify-center">
      <a
        [href]="githubHref"
        target="_blank"
        rel="noopener noreferrer"
        [attr.title]="githubHref"
        class="text-center text-sm text-muted no-underline transition-colors hover:text-primary"
        >{{ language.messages().footerBuiltBy }}</a
      >
    </div>

    <div class="flex justify-center md:justify-end">
      <div
        class="inline-flex items-center gap-0.5 rounded-lg border border-border bg-bg p-[calc(0.125rem*0.85)] shadow-sm"
        role="group"
        [attr.aria-label]="language.messages().themeGroup"
      >
        <button
          type="button"
          class="rounded-md p-[calc(0.5rem*0.85)] text-muted transition-colors hover:bg-border/50 hover:text-fg focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
          [class.bg-border/60]="theme.mode() === 'default'"
          [class.text-fg]="theme.mode() === 'default'"
          [attr.aria-pressed]="theme.mode() === 'default'"
          [attr.aria-label]="language.messages().themeDefault"
          (click)="setTheme('default')"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-[calc(1.25rem*0.85)] w-[calc(1.25rem*0.85)]" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25"
            />
          </svg>
        </button>
        <button
          type="button"
          class="rounded-md p-[calc(0.5rem*0.85)] text-muted transition-colors hover:bg-border/50 hover:text-fg focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
          [class.bg-border/60]="theme.mode() === 'light'"
          [class.text-fg]="theme.mode() === 'light'"
          [attr.aria-pressed]="theme.mode() === 'light'"
          [attr.aria-label]="language.messages().themeLight"
          (click)="setTheme('light')"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-[calc(1.25rem*0.85)] w-[calc(1.25rem*0.85)]" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
          </svg>
        </button>
        <button
          type="button"
          class="rounded-md p-[calc(0.5rem*0.85)] text-muted transition-colors hover:bg-border/50 hover:text-fg focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
          [class.bg-border/60]="theme.mode() === 'dark'"
          [class.text-fg]="theme.mode() === 'dark'"
          [attr.aria-pressed]="theme.mode() === 'dark'"
          [attr.aria-label]="language.messages().themeDark"
          (click)="setTheme('dark')"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-[calc(1.25rem*0.85)] w-[calc(1.25rem*0.85)]" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</footer>
