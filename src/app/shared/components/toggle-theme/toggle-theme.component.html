<button
  class="theme-toggle me-2 mt-2"
  type="button"
  (click)="toggle()"
  [attr.aria-pressed]="theme === 'dark'"
  [attr.aria-label]="
    theme === 'dark' ? 'Alternar para tema claro' : 'Alternar para tema escuro'
  "
  title="{{ theme === 'dark' ? 'Tema escuro' : 'Tema claro' }}"
>
  <i
    class="bi"
    [ngClass]="theme === 'dark' ? 'bi-moon-stars-fill' : 'bi-sun-fill'"
  ></i>
</button>
